name: Streamlit CI Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:

  # --------------------------------------------------
  # Job 1: Linting
  # --------------------------------------------------
  lint:
    name: Lint Streamlit Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.4.2 flake8==7.0.0

      - name: Run Black (format check)
        run: |
          black . --check --diff

      - name: Run Flake8
        run: |
          flake8 . --max-line-length=100 --ignore=E203,W503


  # --------------------------------------------------
  # Job 2: Tests
  # --------------------------------------------------
  test:
    name: Streamlit App Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -v || echo "No tests found, skipping"


  # --------------------------------------------------
  # Job 3: Build Docker Image
  # --------------------------------------------------
  docker-build:
    name: Build Streamlit Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t meal-tracker:latest .
